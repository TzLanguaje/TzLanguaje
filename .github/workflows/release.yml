# ==========================
# RELEASE - publicar binarios
# ==========================
#
# Se dispara al empujar una etiqueta
# de version:
#
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Compila en los tres sistemas,
# empaqueta el binario 'tz', calcula
# los checksums y crea el release de
# GitHub con todo dentro.
#
# Lo que descarguen install.sh e
# install.ps1 sale de aqui.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta a publicar (ej. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  # ==========================
  # 1. La etiqueta debe coincidir
  #    con src/version.h
  # ==========================
  #
  # version.h es la unica fuente de
  # verdad. Si la etiqueta dice otra
  # cosa, el release se para aqui en
  # vez de publicar un binario que
  # miente al decir --version.

  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: v
        run: |
          set -eu
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          HEADER=$(sed -n 's/.*TZLANG_VERSION "\([0-9.]*\)".*/\1/p' src/version.h)
          echo "etiqueta:   $TAG"
          echo "version.h:  $HEADER"
          if [ "$TAG" != "v$HEADER" ]; then
            echo "::error::La etiqueta $TAG no coincide con TZLANG_VERSION $HEADER en src/version.h"
            exit 1
          fi
          echo "version=$HEADER" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"        >> "$GITHUB_OUTPUT"

  # ==========================
  # 2. Compilar en cada plataforma
  # ==========================

  build:
    needs: check
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    # Compilar esto son segundos. Si un
    # job pasa de 20 minutos es que se
    # ha quedado esperando un runner:
    # mejor que falle y se vea, a que
    # cuelgue el release seis horas.
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          # cmake_extra siempre lleva
          # valor: un argumento vacio
          # haria fallar a cmake.
          # -Wno-dev es el relleno
          # inofensivo.
          # No se fija la version de
          # Ubuntu: el binario se enlaza
          # estaticamente, asi que la
          # glibc del runner da igual, y
          # las etiquetas viejas se
          # retiran y dejan el job
          # esperando un runner que ya
          # no existe.
          - target: linux-x86_64
            os: ubuntu-latest
            cmake_extra: -Wno-dev
            deb_arch: amd64
            rpm_arch: x86_64
          - target: linux-aarch64
            os: ubuntu-24.04-arm
            cmake_extra: -Wno-dev
            deb_arch: arm64
            rpm_arch: aarch64
          # Un solo binario universal
          # para Intel y Apple Silicon.
          - target: macos-universal
            os: macos-14
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64
          - target: windows-x86_64
            os: windows-latest
            cmake_extra: -Wno-dev

    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: >
          cmake -B build-rel
          -DCMAKE_BUILD_TYPE=Release
          -DTZLANG_STATIC=ON
          "${{ matrix.cmake_extra }}"

      - name: Compilar
        run: cmake --build build-rel --config Release

      - name: Comprobar que arranca
        if: runner.os != 'Windows'
        run: ./build-rel/tz --version

      - name: Comprobar que arranca (Windows)
        if: runner.os == 'Windows'
        run: build-rel\Release\tz.exe --version

      # ==========================
      # Empaquetar
      # ==========================
      #
      # Unix: tar.gz con el binario,
      # LICENSE y README. Windows: zip
      # con lo mismo.

      - name: Empaquetar (Unix)
        if: runner.os != 'Windows'
        run: |
          set -eu
          NAME="tzlang-v${{ needs.check.outputs.version }}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp build-rel/tz "dist/$NAME/"
          cp LICENSE README.md "dist/$NAME/"
          tar -czf "dist/$NAME.tar.gz" -C dist "$NAME"
          rm -rf "dist/$NAME"

      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "tzlang-v${{ needs.check.outputs.version }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist\$name" | Out-Null
          Copy-Item build-rel\Release\tz.exe "dist\$name\"
          Copy-Item LICENSE, README.md "dist\$name\"
          Compress-Archive -Path "dist\$name\*" -DestinationPath "dist\$name.zip"
          Remove-Item -Recurse -Force "dist\$name"

      # ==========================
      # INSTALADORES NATIVOS
      # ==========================
      #
      # Ademas del archivo comprimido,
      # cada plataforma produce su
      # instalador de siempre: .pkg con
      # asistente en macOS, .exe con
      # asistente en Windows, .deb y
      # .rpm en Linux.
      #
      # Cada uno se INSTALA aqui mismo
      # para comprobar que funciona de
      # verdad, no solo que se
      # construye.

      - name: Instalador .pkg (macOS)
        if: startsWith(matrix.target, 'macos')
        run: sh packaging/macos/build-pkg.sh build-rel/tz dist

      - name: Comprobar el .pkg instalando
        if: startsWith(matrix.target, 'macos')
        run: |
          set -eu
          sudo installer -pkg dist/TzLang-v${{ needs.check.outputs.version }}-macos.pkg -target /
          /usr/local/bin/tz --version
          /usr/local/bin/tz examples/hola.tz

      - name: Paquetes .deb y .rpm (Linux)
        if: startsWith(matrix.target, 'linux')
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm
          sh packaging/linux/build-deb.sh build-rel/tz ${{ matrix.deb_arch }} dist
          sh packaging/linux/build-rpm.sh build-rel/tz ${{ matrix.rpm_arch }} dist

      - name: Comprobar el .deb instalando
        if: startsWith(matrix.target, 'linux')
        run: |
          set -eu
          sudo dpkg -i dist/tzlang_${{ needs.check.outputs.version }}_${{ matrix.deb_arch }}.deb
          tz --version
          tz examples/hola.tz
          # Y que se desinstale limpio.
          sudo dpkg -r tzlang
          # bash recuerda donde estaba
          # cada orden; sin hash -r
          # seguiria diciendo que tz
          # existe.
          hash -r
          ! command -v tz

      - name: Comprobar el contenido del .rpm
        if: startsWith(matrix.target, 'linux')
        run: |
          set -eu
          rpm -qlp dist/tzlang-${{ needs.check.outputs.version }}-1.${{ matrix.rpm_arch }}.rpm
          rpm -qip dist/tzlang-${{ needs.check.outputs.version }}-1.${{ matrix.rpm_arch }}.rpm

      - name: Instalador .exe (Windows)
        if: startsWith(matrix.target, 'windows')
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc `
            /DTzVersion=${{ needs.check.outputs.version }} `
            "/DTzBinario=$PWD\build-rel\Release\tz.exe" `
            "/DTzSalida=$PWD\dist" `
            packaging\windows\tzlang.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Comprobar el .exe instalando
        if: startsWith(matrix.target, 'windows')
        shell: pwsh
        run: |
          $setup = "dist\TzLang-v${{ needs.check.outputs.version }}-windows-x86_64-setup.exe"
          # /VERYSILENT instala sin
          # asistente; asi se comprueba
          # el instalador sin que nadie
          # pulse Siguiente.
          Start-Process $setup -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $tz = "$env:LOCALAPPDATA\Programs\TzLang\bin\tz.exe"
          if (-not (Test-Path $tz)) { throw "el instalador no dejo tz.exe en $tz" }
          & $tz --version
          & $tz examples\hola.tz
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # ==========================
  # 3. Publicar el release
  # ==========================

  publish:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Un solo archivo de checksums
      # para todo el release, para que
      # los instaladores y Homebrew
      # puedan verificar la descarga.
      #
      # Se escribe FUERA de artifacts/
      # y luego se mueve dentro, para
      # que el propio archivo no pueda
      # acabar en su propia lista.
      - name: Checksums
        run: |
          set -eu
          ( cd artifacts && sha256sum -- * ) > SHA256SUMS.txt
          mv SHA256SUMS.txt artifacts/
          cat artifacts/SHA256SUMS.txt

      - name: Crear el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "${{ needs.check.outputs.tag }}" \
            --title "TzLang ${{ needs.check.outputs.tag }}" \
            --generate-notes \
            --verify-tag \
            artifacts/*

  # ==========================
  # 4. Publicar en npm
  # ==========================
  #
  # Cinco paquetes: cuatro con el
  # binario de cada plataforma, que
  # declaran 'os' y 'cpu' para que npm
  # instale solo el que toca, y el
  # principal 'tzlang', que los lista
  # como optionalDependencies y trae
  # el lanzador.
  #
  # Va DESPUES de publish: si la
  # release de GitHub fallara, no
  # tiene sentido publicar en npm una
  # version que no existe.

  npm:
    needs: [check, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Sin token no se publica, pero
      # TAMPOCO se falla: la release de
      # GitHub ya salio bien y no debe
      # aparecer en rojo por esto.
      - name: ¿Hay token de npm?
        id: token
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "hay=si" >> "$GITHUB_OUTPUT"
          else
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN no esta configurado; se omite la publicacion en npm."
          fi

      - name: Preparar los paquetes
        if: steps.token.outputs.hay == 'si'
        run: sh packaging/npm/build-npm.sh artifacts dist/npm

      - name: Comprobar que el lanzador arranca
        if: steps.token.outputs.hay == 'si'
        run: |
          set -eu
          node --check dist/npm/tzlang/bin/tz.js
          # El binario de Linux x64 es el
          # del propio runner: se puede
          # ejecutar aqui mismo.
          chmod +x dist/npm/tzlang-linux-x64/bin/tz
          dist/npm/tzlang-linux-x64/bin/tz --version

      # Primero los de plataforma: el
      # principal depende de ellos.
      - name: Publicar los paquetes de plataforma
        if: steps.token.outputs.hay == 'si'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -eu
          for p in tzlang-darwin tzlang-linux-x64 tzlang-linux-arm64 tzlang-win32-x64; do
            echo "publicando $p"
            ( cd "dist/npm/$p" && npm publish --access public )
          done

      - name: Publicar tzlang
        if: steps.token.outputs.hay == 'si'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: cd dist/npm/tzlang && npm publish --access public
